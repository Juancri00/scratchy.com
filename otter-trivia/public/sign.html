<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Otter Trivia Booth Sign</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/sign.css">
</head>
<body>
  <div class="sign">
    <div class="sign-head">
      <img src="/brand/logo.svg" alt="Otter" width="224" height="64">
    </div>
    <p class="eyebrow">Restaurant Trivia Challenge</p>
    <h1>Think you know restaurants?</h1>
    <p class="sub">8 quick questions. About 90 seconds. Play for a chance to win!</p>
    <img class="qr" src="/qr.svg" alt="Scan to play" width="420" height="420">
    <p class="scan">📱 Scan with your phone camera to play</p>
    <p class="fine">Winner selected at random from eligible entries. See rules in the game.</p>
  </div>
</body>
</html>
